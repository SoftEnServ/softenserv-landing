server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # DNS interno de Docker: resuelve "api" en cada petición,
  # así Nginx no se cae si la API aún no está lista al arrancar.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # La API se sirve bajo el mismo dominio: /api -> contenedor "api"
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # JS y CSS de Angular llevan un hash en el nombre: se pueden guardar mucho tiempo
  location ~* \.(js|css|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Logos, íconos e imágenes mantienen su nombre al cambiar: el navegador revalida en cada visita
  location ~* \.(svg|png|ico|jpg|jpeg|webp)$ {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta vuelve a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
